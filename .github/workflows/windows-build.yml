name: Build Ardour for Windows

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup MSYS2 and Install Dependencies
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-git
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-boost
          mingw-w64-x86_64-gtk2
          mingw-w64-x86_64-glibmm
          mingw-w64-x86_64-gtkmm24
          mingw-w64-x86_64-libxml2
          mingw-w64-x86_64-libsndfile
          mingw-w64-x86_64-libsamplerate
          mingw-w64-x86_64-taglib
          mingw-w64-x86_64-vamp-plugin-sdk
          mingw-w64-x86_64-rubberband
          mingw-w64-x86_64-fftw
          mingw-w64-x86_64-aubio
          mingw-w64-x86_64-liblo

    - name: Run Waf Configure
      shell: msys2 {0}
      run: |
        python waf configure --ptformat --optimize --no-phone-home

    - name: Run Waf Build
      shell: msys2 {0}
      run: |
        python waf

    - name: Stage Build Binaries
      shell: msys2 {0}
      run: |
        mkdir -p deploy/bin
        # Copy the build output. Adjust this folder pattern if your version targets specific subdirectories.
        cp -r build/gtk2_ardour/* deploy/bin/ || true
        # Copy required MinGW system DLLs so the app can launch on a standard Windows machine
        cp /mingw64/bin/*.dll deploy/bin/ || true

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ardour-Windows-Build
        path: deploy/bin/
